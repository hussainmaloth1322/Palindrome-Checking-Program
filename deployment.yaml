apiVersion: apps/v1
kind: Deployment
metadata:
  name: palindrome-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: palindrome
  template:
    metadata:
      labels:
        app: palindrome
    spec:
      containers:
        - name: palindrome-container
          image: palindrome-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: palindrome-service
spec:
  type: NodePort
  selector:
    app: palindrome
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
